name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - clients/connectrpc_client
          - clients/grpc_client
          - launcher/ops/sentry
          - transport/connectrpc_transport
          - transport/grpc_transport
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: verify go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy -diff

      - name: build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - clients/connectrpc_client
          - clients/grpc_client
          - launcher/ops/sentry
          - transport/connectrpc_transport
          - transport/grpc_transport
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
