# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mx

# mx is a library: there is nothing to compile or to archive, the release
# only carries the changelog of the tag.
builds:
  - skip: true

changelog:
  disable: false
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: Tests
      regexp: '^.*?test(\(.+\))??!?:.+$'
      order: 5
    - title: Dependencies
      regexp: '^(.*?(build|chore)\(deps\)!?:.+|[Bb]ump .+)$'
      order: 6
    - title: Build & CI
      regexp: '^.*?(build|ci)(\(.+\))??!?:.+$'
      order: 7
    # Catch-all: keep every remaining commit in the release notes.
    - title: Other changes
      order: 999

release:
  github:
    owner: tkcrm
    name: mx
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## mx {{ .Tag }}

    ```sh
    go get github.com/tkcrm/mx@{{ .Tag }}
    ```
  footer: |

    **Full changelog**: https://github.com/tkcrm/mx/compare/{{ .PreviousTag }}...{{ .Tag }}
